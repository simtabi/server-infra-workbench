# production-single: one hardened DB droplet (4 GB minimum) and one web droplet for prd.
# PITR with pgBackRest, off-site copies, TLS inside the VPC, a separate migrator role, alerts and uptime
# checks; prd guard rails on. Best-practice warnings are errors (STRICT=1).
PROFILE_VERSION=1
PROFILE_DESCRIPTION="hardened prd on one 4 GB+ DB droplet: PITR, off-site, TLS, alerts, guard rails"
MIN_DB_MB=4096
DB_DROPLET_MB=4096
WEB_DROPLET_MB=4096
STRICT=1
ENVS="prd"
TENANT_ENVS=""
PROTECTED_ENVS="prd"
PRD_LOCATION=local
PG_APP_CREATEDB=0
ENV_MIGRATOR=1
TLS_MODE=require
RETENTION="daily=14 weekly=8 monthly=12 yearly=2"
PITR=pgbackrest
OFFSITE=s3
DO_ALERTS=1
UPTIME_CHECKS=1
STORAGE=spaces
