# dev-budget: the cheapest sensible setup for development and staging on 2 GB droplets.
# Postgres + PgBouncer only (MySQL/MariaDB/MongoDB off), shared envs on one DB droplet, nightly backups
# copied off-site, DO Spaces for files. Production lives elsewhere (PRD_LOCATION=droplet).
PROFILE_VERSION=1
PROFILE_DESCRIPTION="2 GB, Postgres + PgBouncer only, shared tst/dev/stg, off-site backups, DO Spaces"
DB_DROPLET_MB=2048
WEB_DROPLET_MB=2048
ENVS="tst dev stg"
TENANT_ENVS="tst dev stg"
PROTECTED_ENVS="stg"
PRD_LOCATION=droplet
ENABLE_MYSQL=0
ENABLE_MARIADB=0
RETENTION="daily=7 weekly=4"
OFFSITE=s3
STORAGE=spaces
