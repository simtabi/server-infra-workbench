# cross-region-wireguard: web in one region, the DB in another. DO VPCs are regional, so traffic goes
# through a WireGuard tunnel (WIREGUARD_CIDR) that VPC_CIDR must cover. Expect a few ms to tens of ms extra
# per query (estimate, depends on the region pair); keep queries few and batched.
PROFILE_VERSION=1
PROFILE_DESCRIPTION="web and DB in different regions over WireGuard; TLS on, off-site backups"
REGION=nyc3
PEER_REGION=ams3
WIREGUARD=1
WIREGUARD_CIDR=10.200.0.0/24
VPC_CIDR=10.0.0.0/8
TLS_MODE=require
ENVS="dev stg"
TENANT_ENVS="dev stg"
PROTECTED_ENVS="stg"
PRD_LOCATION=droplet
OFFSITE=s3
STORAGE=spaces
