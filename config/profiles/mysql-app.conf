# mysql-app: a Laravel app on MySQL instead of Postgres (no Postgres, no PgBouncer).
PROFILE_VERSION=1
PROFILE_DESCRIPTION="MySQL only, dev + stg, off-site backups, DO Spaces"
ENABLE_POSTGRES=0
ENABLE_PGBOUNCER=0
ENABLE_MYSQL=1
ENVS="dev stg"
TENANT_ENVS="dev stg"
PROTECTED_ENVS="stg"
PRD_LOCATION=droplet
OFFSITE=s3
STORAGE=spaces
