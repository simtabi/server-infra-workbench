# multi-engine: Postgres + PgBouncer, MySQL and MariaDB side by side (e.g. while migrating an old app).
# Needs about 3.4 GB of RAM for the engines (estimate), so a 4 GB DB droplet.
PROFILE_VERSION=1
PROFILE_DESCRIPTION="Postgres + MySQL + MariaDB on one 4 GB DB droplet, dev + stg"
DB_DROPLET_MB=4096
ENABLE_MYSQL=1
ENABLE_MARIADB=1
ENVS="dev stg"
TENANT_ENVS="dev stg"
PROTECTED_ENVS="stg"
PRD_LOCATION=droplet
OFFSITE=s3
STORAGE=spaces
