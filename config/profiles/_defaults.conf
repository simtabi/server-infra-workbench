# Base settings. Every profile in this folder is layered onto this file (profile keys win), then
# `bin/siwo configure --set KEY=VALUE` overrides win. No secrets here or in any profile.
# Keys and their meaning: docs/reference/profiles.md
PROFILE_VERSION=1
PROFILE_DESCRIPTION="base settings every profile starts from"

# ---- topology (checked by configure; not written to servers) ------------------
CLOUD=do                    # do (DigitalOcean) | gcp (Google Cloud): the region list and sizes the checks use
REGION=nyc3                 # region of the servers: a DO slug (nyc3) or, with CLOUD=gcp, a GCP region (us-central1)
PEER_REGION=                # second region (cross-region-wireguard only)
VPC_CIDR=10.0.0.0/8         # what the DB accepts connections from (the manager's VPC_CIDR)
DB_PRIVATE_IP=              # eth1 address of the DB droplet (empty: the manager detects it)
WEB_PRIVATE_IP=
DB_MODE=self                # self (this repo's manager) | managed (DO Managed DB) | replica (self + read replica, docs-driven)
DB_DROPLET_MB=2048
WEB_DROPLET_MB=2048
DEDICATED_DROPLET_MB=2048   # only used when an add-on has role dedicated
SINGLE_DROPLET=0            # 1 = web and DB on ONE droplet (dev only): RAM checked as one node of DB_DROPLET_MB
WEB_NODES=1
LOAD_BALANCER=0
WIREGUARD=0
WIREGUARD_CIDR=10.200.0.0/24
MIN_DB_MB=1024              # the profile's floor for DB_DROPLET_MB
STRICT=0                    # 1 = best-practice warnings become errors (production profiles)
HARDEN=1                    # run `bin/siwo server harden` after setup
DO_ALERTS=0                 # DO monitoring alert policies (CPU, memory, disk, load)
UPTIME_CHECKS=0             # DO uptime check on the app URL

# ---- DB manager (/etc/docker-db-server-manager.conf) ---------------------------
APP=                        # app name; with ENVS gives databases <app>_<env>
PG_USER=app
PG_DB=app
ENABLE_POSTGRES=1
ENABLE_PGBOUNCER=1
ENABLE_MYSQL=0
ENABLE_MARIADB=0
ENABLE_ADMINER=0
PG_APP_CREATEDB=1           # app role may create (tenant) databases
TLS_MODE=off                # off | require | verify-full (web hosts check the CA: tls-ca)
ENVS=
TENANT_ENVS=
PROTECTED_ENVS="stg prd"
PRD_LOCATION=local          # local | droplet | managed
ENV_MIGRATOR=0
RETENTION="daily=7 weekly=4"
PITR=off                    # off | pgbackrest
OFFSITE=none                # none | s3
OFFSITE_ENDPOINT=           # empty + OFFSITE=s3: https://<REGION>.digitaloceanspaces.com
OFFSITE_REGION=us-east-1
OFFSITE_BUCKET=
ALERT_EMAIL=

# ---- add-ons (stacks/addons, src/shell/addons/addon.sh) ------------------------
GOTENBERG=0
GOTENBERG_ROLE=web          # web | db | dedicated
STORAGE=none                # none | spaces (managed) | garage | seaweedfs | rustfs (experimental)
STORAGE_ROLE=db             # web | db | dedicated (self-hosted stores only)
STORAGE_BUCKET=app
STORAGE_DATA_DIR=           # e.g. /mnt/volume_nyc3_01/garage (a DO volume)

# ---- monitoring (stacks/monitor, src/shell/monitor/monitor.sh) -------------------
MONITOR_STACKS=none         # none | any of beszel,kuma,netdata,prometheus (docs/tools/monitor.md)
MONITOR_HUB=web             # web | db | dedicated: where the UIs/storage run; every node gets the agents
MONITOR_PROBE_URLS=         # "https://app.example.com/up ..." (Prometheus blackbox / Kuma checks)
MONITOR_ALLOW_TIGHT=0       # 1 = allow heavy stacks next to a DB on <= 2 GB (you accept the OOM risk)
