# production-ha: no single point of failure for the app tier. A load balancer, two web nodes, a managed
# database (or a self-hosted primary + replica, see docs/high-availability.md) and DO Spaces for
# files (web nodes must not keep files locally). Most steps are documented, not automated.
PROFILE_VERSION=1
PROFILE_DESCRIPTION="LB + 2 web nodes, managed (or replica) DB, Spaces; docs-driven"
DB_MODE=managed
MIN_DB_MB=4096
DB_DROPLET_MB=4096
WEB_DROPLET_MB=4096
WEB_NODES=2
LOAD_BALANCER=1
STRICT=1
ENVS="prd"
TENANT_ENVS=""
PROTECTED_ENVS="prd"
PRD_LOCATION=managed
PG_APP_CREATEDB=0
TLS_MODE=require
DO_ALERTS=1
UPTIME_CHECKS=1
STORAGE=spaces
MONITOR_STACKS=beszel,kuma
MONITOR_HUB=dedicated       # monitoring must survive a web node failure
