# Changes to the Ploi site's Nginx config on BOTH nodes (Site -> Manage -> Nginx configuration).
# The load balancer ends TLS and forwards plain HTTP over the VPC, so each node serves the site on port 80:
#   listen 80 default_server;    # the LB health check sends no Host header: it must land on this site
#   (remove `default_server` from any other site on the node; request no certificate for this site in Ploi:
#   the load balancer holds it, and a node-level HTTP->HTTPS redirect would loop behind it)
#
# Inside the server { } block: log and rate-limit by the visitor, not by the load balancer.
set_real_ip_from 10.0.0.0/20;          # VPC_CIDR: where the load balancer's requests come from
real_ip_header X-Forwarded-For;
real_ip_recursive on;
