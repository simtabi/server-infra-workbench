# Replaces Ploi's `location / { try_files ... }` and `location ~ \.php$` blocks (Site -> Manage -> Nginx
# configuration). Needs /etc/nginx/snippets/siw-proxy.conf (examples/_shared/nginx-proxy.conf).
location /_next/static/ {                 # content-hashed build output: Nginx serves it, cached for a year
    alias /home/ploi/www.example.com/.next/static/;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}
location / {
    include snippets/siw-proxy.conf;
    proxy_buffering off;                  # streamed RSC / Suspense chunks reach the browser as they render
    proxy_pass http://127.0.0.1:3000;
}
