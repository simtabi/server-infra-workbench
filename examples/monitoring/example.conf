# Beszel + Uptime Kuma hub on the web node, agents on every node; Prometheus + Grafana as the opt-in upgrade.
PROFILE=staging
set APP=shop
set MONITOR_STACKS=beszel,kuma
set MONITOR_HUB=web
set MONITOR_PROBE_URLS=https://stg.example.com/up
set DB_PRIVATE_IP=10.0.0.5
set WEB_PRIVATE_IP=10.0.0.6
set VPC_CIDR=10.0.0.0/20
plan monitor plan --role hub --stacks beszel,kuma
