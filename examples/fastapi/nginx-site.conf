# Replaces Ploi's `location / { try_files ... }` and `location ~ \.php$` blocks of the site (Site -> Manage ->
# Nginx configuration). Needs /etc/nginx/snippets/siw-proxy.conf (examples/_shared/nginx-proxy.conf).
location / {
    include snippets/siw-proxy.conf;
    proxy_buffering off;                 # StreamingResponse / server-sent events reach the client as sent
    proxy_pass http://127.0.0.1:8000;
}
