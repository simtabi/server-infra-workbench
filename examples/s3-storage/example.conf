# Self-hosted S3 for Laravel files: Garage on the DB node (VPC IP), app key generated at install.
PROFILE=dev-budget
set APP=shop
set STORAGE=garage
set STORAGE_ROLE=db
set STORAGE_BUCKET=shop
set STORAGE_DATA_DIR=/mnt/volume_nyc3_01/garage
set DB_PRIVATE_IP=10.0.0.5
set WEB_PRIVATE_IP=10.0.0.6
set VPC_CIDR=10.0.0.0/20
plan addon plan garage --role db --bind 10.0.0.5
plan addon plan seaweedfs --role db --bind 10.0.0.5
