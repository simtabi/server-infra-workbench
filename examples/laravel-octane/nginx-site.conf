# The part of the Ploi site's Nginx config that changes for Octane (Site -> Manage -> Nginx configuration).
# Ploi keeps the server { listen, server_name, ssl_* } lines; replace its `location / { try_files ... }` and the
# `location ~ \.php$` block with these. Needs /etc/nginx/snippets/siw-proxy.conf (examples/_shared/nginx-proxy.conf).
#
# Outside the server { } block (top of the file):
upstream app_example_com {
    server 127.0.0.1:8000 max_fails=1 fail_timeout=3s;
    keepalive 16;
}

# Inside the server { } block (Ploi's `root .../public;` stays: Nginx serves the built assets itself):
location /build/ {
    expires 1y;
    add_header Cache-Control "public, immutable";       # Vite file names change with their content
    access_log off;
    try_files $uri =404;
}
location / {
    try_files $uri @octane;                              # a real file in public/ (favicon, robots.txt), else Octane
}
location @octane {
    include snippets/siw-proxy.conf;
    proxy_next_upstream error timeout http_502;
    proxy_pass http://app_example_com;
}
