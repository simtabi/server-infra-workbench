# Gotenberg (HTML/Office -> PDF) on the web node, loopback only, basic auth with a generated password.
PROFILE=dev-budget
set APP=shop
set GOTENBERG=1
set GOTENBERG_ROLE=web
set WEB_DROPLET_MB=4096  # the configurator refuses 2 GB: PHP + Gotenberg need ~2.5 GB
plan addon plan gotenberg --role web --bind 127.0.0.1
