# Laravel multi-tenant: one landlord DB per env, tenant DBs created at runtime (<app>_<env>_t_<id>).
PROFILE=dev-budget
set APP=shop
set ENVS=dev stg
set TENANT_ENVS=dev stg
set PG_APP_CREATEDB=1
set DB_PRIVATE_IP=10.0.0.5
set WEB_PRIVATE_IP=10.0.0.6
set VPC_CIDR=10.0.0.0/20
plan profile show dev-budget
