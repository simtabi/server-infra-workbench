# WordPress (Bedrock layout) on MySQL: Ploi WordPress site on the web droplet, MySQL only on the DB droplet.
PROFILE=mysql-app
set APP=blog
set ALERT_EMAIL=ops@example.com
set DB_PRIVATE_IP=10.0.0.5
set WEB_PRIVATE_IP=10.0.0.6
set VPC_CIDR=10.0.0.0/20
set OFFSITE_BUCKET=blog-db-backups
plan profile show mysql-app
appenv wordpress
