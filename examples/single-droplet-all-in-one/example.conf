# dev only: Ploi (PHP, Nginx) and the DB manager's Docker stack on ONE 4 GB droplet; the DB bound to the private IP.
PROFILE=dev-budget
set APP=lab
set ENVS=dev
set TENANT_ENVS=
set PROTECTED_ENVS=
set SINGLE_DROPLET=1
set DB_DROPLET_MB=4096
set WEB_DROPLET_MB=4096
set DB_PRIVATE_IP=10.0.0.5
set WEB_PRIVATE_IP=10.0.0.5
set VPC_CIDR=10.0.0.0/20
plan profile show dev-budget
