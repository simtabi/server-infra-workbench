# Replaces Ploi's `location / { try_files ... }` and `location ~ \.php$` blocks (Site -> Manage -> Nginx
# configuration). The site's web directory is /public. Needs /etc/nginx/snippets/siw-proxy.conf.
location /assets/ {                       # fingerprinted by Propshaft: cache forever, Puma never sees them
    expires max;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}
location / {
    try_files $uri @puma;                 # other files in public/ (robots.txt, 404.html) straight from disk
}
location @puma {
    include snippets/siw-proxy.conf;
    proxy_pass http://127.0.0.1:3000;
}
