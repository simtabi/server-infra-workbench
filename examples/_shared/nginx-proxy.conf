# examples/_shared/nginx-proxy.conf - the proxy headers every app-server example uses (one copy, included).
#
# Install once per web server:   sudo install -m 644 nginx-proxy.conf /etc/nginx/snippets/siw-proxy.conf
# Then, in the Ploi site's Nginx config (Site -> Manage -> Nginx configuration), replace `location / { ... }`:
#
#   location / {
#       include snippets/siw-proxy.conf;
#       proxy_pass http://127.0.0.1:3000;     # the port the example's daemon listens on (loopback only)
#   }
#
# Why each line:
#   HTTP/1.1 + empty Connection  keepalive to the upstream (no new TCP connection per request)
#   Host / X-Forwarded-*         the app builds https:// URLs and sees the client IP; the app must trust only
#                                127.0.0.1 for these (gunicorn/uvicorn --forwarded-allow-ips, Rails/Express trust proxy)
#   timeouts                     a hung upstream returns 504 after 60 s instead of holding the worker forever
# WebSockets need `Upgrade`/`Connection: upgrade` instead of the empty Connection header: see
# examples/laravel-horizon-reverb/nginx-reverb.conf. Streaming responses: `proxy_buffering off` in that location.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
