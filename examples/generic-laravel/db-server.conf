# /etc/docker-db-server-manager.conf for a Postgres-only DB server (no secrets).
# Generate your own with:  docker-db-server-manager.sh init > db-server.conf
EXPECTED_PRIVATE_IP=10.0.0.5
PRIVATE_IP=10.0.0.5
VPC_CIDR=10.0.0.0/20
PG_USER=app
PG_DB=app
ENABLE_POSTGRES=1
ENABLE_PGBOUNCER=1
ENABLE_MYSQL=0
ENABLE_MARIADB=0
# plain PostGIS-free Postgres with pgvector only:
#PG_BASE_IMAGE=postgres:18
#PG_EXTENSIONS=vector pg_trgm pgcrypto pg_stat_statements
#BACKUP_HOOK=rclone copy "$1" spaces:my-bucket/db/$(basename "$1")
WEB_ENV=/home/ploi/app.example.com-shared/.env
