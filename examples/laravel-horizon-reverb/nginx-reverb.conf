# Add inside the Ploi site's server { } block (Site -> Manage -> Nginx configuration), before `location /`.
# Reverb answers websockets on /app/<key> and the publish API on /apps/<id>/...; both reach the daemon on
# loopback, so Reverb never needs its own port, certificate or firewall rule.
location ~ ^/apps?/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;     # websocket handshake
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;                     # > Reverb's ping interval (60 s), so idle sockets stay open
    proxy_send_timeout 120s;
    proxy_pass http://127.0.0.1:8080;
}
