# Laravel prd with Horizon (Redis queues) and Reverb (websockets) as Ploi daemons; hardened DB droplet in the VPC.
PROFILE=production-single
set APP=shop
set ALERT_EMAIL=ops@example.com
set DB_PRIVATE_IP=10.0.0.5
set WEB_PRIVATE_IP=10.0.0.6
set VPC_CIDR=10.0.0.0/20
set OFFSITE_BUCKET=shop-db-backups
plan profile show production-single
plan env init --help
plan ploi --help
appenv none
