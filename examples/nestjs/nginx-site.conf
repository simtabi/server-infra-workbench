# Replaces Ploi's `location / { try_files ... }` and `location ~ \.php$` blocks (Site -> Manage -> Nginx
# configuration). Needs /etc/nginx/snippets/vsw-proxy.conf (examples/_shared/nginx-proxy.conf).
client_max_body_size 10m;                 # match the API's own body limit, so Nginx refuses bigger ones first
location / {
    include snippets/vsw-proxy.conf;
    proxy_pass http://127.0.0.1:3001;
}
