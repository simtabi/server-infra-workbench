# Inside the Ploi site's server { } block, once the web names are proxied (orange cloud).
#
# 1. The visitor's IP, not Cloudflare's, in logs, rate limits and Laravel's request()->ip():
#    generate the ranges (they change; never hand-edit):  examples/cloudflare-dns-proxy/cf-dns.sh realip
include snippets/cloudflare-realip.conf;
#
# 2. Only Cloudflare may talk to this origin (Authenticated Origin Pulls; enable it in the CF dashboard,
#    SSL/TLS -> Origin Server). Without it, anyone who finds the droplet's IP skips the WAF and rate limits.
#    The CA is Cloudflare's public origin-pull certificate:
#      sudo curl -fsS -o /etc/nginx/cloudflare-origin-pull-ca.pem https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
ssl_client_certificate /etc/nginx/cloudflare-origin-pull-ca.pem;
ssl_verify_client on;
