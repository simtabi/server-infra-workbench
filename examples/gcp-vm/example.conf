# The split web + DB layout on two GCP Compute Engine VMs: VPC firewall rules by network tag, GCS for off-site.
PROFILE=production-single
set APP=shop
set ALERT_EMAIL=ops@example.com
set DB_PRIVATE_IP=10.128.0.5
set WEB_PRIVATE_IP=10.128.0.6
set VPC_CIDR=10.128.0.0/20
set OFFSITE_BUCKET=shop-db-backups
set OFFSITE_ENDPOINT=https://storage.googleapis.com
set OFFSITE_REGION=auto
set DO_ALERTS=0
set UPTIME_CHECKS=0
set STORAGE=none
plan profile show production-single
plan gcp --help
selftest gcp-firewall.sh
