# The part of the Ploi site's Nginx config that changes for Django (Site -> Manage -> Nginx configuration).
# Ploi keeps the server { listen, server_name, ssl_* } lines; replace its `location / { try_files ... }` and the
# `location ~ \.php$` block with these. Needs /etc/nginx/snippets/vsw-proxy.conf (examples/_shared/nginx-proxy.conf).
#
# Outside the server { } block (top of the file):
upstream api_example_com {
    server 127.0.0.1:8000 max_fails=1 fail_timeout=5s;
    #server 127.0.0.1:8001 max_fails=1 fail_timeout=5s;   # second daemon (PORT=8001): rolling restarts
    keepalive 16;
}

# Inside the server { } block:
location /static/ {
    alias /home/ploi/api.example.com/staticfiles/;      # collectstatic output: Nginx serves it, not Gunicorn
    expires 30d;
    access_log off;
}
location / {
    include snippets/vsw-proxy.conf;
    proxy_next_upstream error timeout http_502;          # a restarting daemon: try the other one
    proxy_pass http://api_example_com;
}
