name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # ubuntu-latest ships shellcheck and docker; one gate, defined in the Makefile.
      - name: Gate (bash -n, shellcheck, smoke tests)
        run: make ci
      - name: Compose examples
        run: make compose-check
