version: 2

updates:
  - package-ecosystem: composer
    directory: /php
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    commit-message:
      prefix: chore(actions)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /stacks/caddy
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    commit-message:
      prefix: chore(images)
