name: Bug report
description: Something behaves incorrectly.
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Please redact tokens, passwords, private keys, real IPs and hostnames before posting.
        Logs from the DB manager and the CLI are already redacted, but check anyway.

  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options:
        - DB server manager / remote-run.sh
        - Deploy script
        - Web tools (update-env-db, check-db-reach)
        - DB tunnels
        - Caddy stack
        - bin/workbench / PHP platform API
        - Python package
        - Docs
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: The exact command (with --dry-run output if it has one) and the redacted output.
      render: shell
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: 'Commit (git rev-parse --short HEAD), manager --version, bin/workbench version, OS'
      placeholder: 'a1b2c3d, manager 1.3.0, workbench 0.1.0 (PHP 8.4.17), Ubuntu 24.04 / macOS 26'
    validations:
      required: true
