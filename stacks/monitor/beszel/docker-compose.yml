# Beszel hub (dashboard + alerts). Rendered and started by src/shell/monitor/monitor.sh; do not edit on the server.
# UI on MONITOR_BIND (loopback) only: reach it with `monitor tunnel` (ssh -L), never a public port.
name: vsw-mon-beszel
services:
  beszel:
    image: ${BESZEL_IMAGE:?pin an image tag}
    restart: unless-stopped
    environment:
      APP_URL: http://127.0.0.1:${BESZEL_PORT:-8090}
      USER_EMAIL: ${BESZEL_ADMIN_EMAIL:?}
      USER_PASSWORD: ${BESZEL_ADMIN_PASSWORD:?generated by monitor.sh}
      CHECK_UPDATES: "false"
    ports: ["${MONITOR_BIND:?}:${BESZEL_PORT:-8090}:8090"]
    volumes: ["./data:/beszel_data"]
    networks: [vsw_monitor]
    mem_limit: 256m
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /beszel, health, --url, "http://localhost:8090"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
networks:
  vsw_monitor: {external: true, name: vsw_monitor}
