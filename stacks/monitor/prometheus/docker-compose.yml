# Prometheus hub. Rendered and started by src/shell/monitor/monitor.sh; do not edit on the server.
# UIs on MONITOR_BIND (loopback) only; blackbox has no published port. monitor.sh writes targets/*.json,
# alertmanager.yml and secrets.env; prometheus.yml, rules/ and grafana/ are copied from the repo.
name: vsw-mon-prometheus
services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:?pin an image tag}
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - ./targets:/etc/prometheus/targets:ro
      - ./data/prometheus:/prometheus
    ports: ["${MONITOR_BIND:?}:${PROMETHEUS_PORT:-9090}:9090"]
    networks: [vsw_monitor]
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  alertmanager:
    image: ${ALERTMANAGER_IMAGE:?pin an image tag}
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./am-secrets:/etc/alertmanager/secrets:ro
      - ./data/alertmanager:/alertmanager
    ports: ["${MONITOR_BIND:?}:${ALERTMANAGER_PORT:-9093}:9093"]
    networks: [vsw_monitor]
    mem_limit: 64m
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  blackbox:
    image: ${BLACKBOX_IMAGE:?pin an image tag}
    restart: unless-stopped
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes: ["./blackbox.yml:/etc/blackbox/blackbox.yml:ro"]
    networks: [vsw_monitor]
    mem_limit: 32m
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:9115/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  grafana:
    image: ${GRAFANA_IMAGE:?pin an image tag}
    restart: unless-stopped
    user: "472:0"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?generated by monitor.sh}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - ./data/grafana:/var/lib/grafana
    ports: ["${MONITOR_BIND:?}:${GRAFANA_PORT:-3300}:3000"]
    networks: [vsw_monitor]
    mem_limit: 256m
    security_opt: [no-new-privileges:true]
    depends_on: {prometheus: {condition: service_healthy}}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
networks:
  vsw_monitor: {external: true, name: vsw_monitor}
