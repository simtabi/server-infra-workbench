# blackbox-exporter modules. http_2xx follows redirects, needs a 2xx and valid TLS (probe_ssl_* metrics).
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: []
      fail_if_not_ssl: false
      tls_config: {insecure_skip_verify: false}
  tcp_connect:
    prober: tcp
    timeout: 5s
