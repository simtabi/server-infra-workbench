# Prometheus config (copied by monitor.sh). Targets are file_sd JSON that `monitor targets` rewrites from
# MONITOR_TARGETS, so adding a node never edits this file. Reload: `monitor targets` (SIGHUP).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels: {monitor: vsw}
rule_files: [/etc/prometheus/rules/*.yml]
alerting:
  alertmanagers: [{static_configs: [{targets: ["alertmanager:9093"]}]}]
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["127.0.0.1:9090"], labels: {host: hub}}]
  - job_name: node
    file_sd_configs: [{files: [/etc/prometheus/targets/node.json]}]
  - job_name: cadvisor
    file_sd_configs: [{files: [/etc/prometheus/targets/cadvisor.json]}]
  - job_name: postgres
    file_sd_configs: [{files: [/etc/prometheus/targets/postgres.json]}]
  - job_name: pgbouncer
    file_sd_configs: [{files: [/etc/prometheus/targets/pgbouncer.json]}]
  - job_name: blackbox-http
    metrics_path: /probe
    params: {module: [http_2xx]}
    file_sd_configs: [{files: [/etc/prometheus/targets/probes.json]}]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: "blackbox:9115"}
