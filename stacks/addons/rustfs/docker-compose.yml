# RustFS (S3-compatible, EXPERIMENTAL). Rendered and started by src/shell/addons/addon.sh.
name: vsw-rustfs
services:
  rustfs:
    image: ${RUSTFS_IMAGE:?pin an image tag}
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?generated by addon.sh}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?generated by addon.sh}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
    volumes:
      - ${ADDON_DATA_DIR:?}/data:/data
    ports:
      - "${ADDON_BIND:?}:${RUSTFS_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    mem_limit: ${RUSTFS_MEM:-768m}
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:9000/health]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
