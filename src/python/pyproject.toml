[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "server-infra-workbench"
version = "0.1.0"
description = "Python helpers for server-infra-workbench (small server checks; platform APIs live in the PHP core)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Simtabi LLC", email = "opensource@simtabi.com" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
workbench-py = "server_infra_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# E501: `ruff format` owns line length; what it leaves long are prose strings (help text, comments)
ignore = ["S101", "E501"]
